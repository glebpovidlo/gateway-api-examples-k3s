apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: httpbin
spec:
  parentRefs: 
    - name: http    # Имя Gateway, которой мы создали (.metadata.name)
      namespace: kgateway-system    # Неймспейс в котором Gateway находится
  hostnames:
    - "www.example.com"    # Хостнейм по которому происходит маршрутизация запросов
  rules:
    - backendRefs:    # Референс на сервис httpbin для sample-приложения
        - name: httpbin
          port: 8000
